name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-win:
    runs-on: windows-latest
    env:
      # CPU-only LLM binaries (skip the Vulkan dead end) + no ~1.3 GB model
      # fetch during install (thin installer - the app downloads it on first
      # launch instead).
      NODE_LLAMA_CPP_GPU: 'false'
      SKIP_MODEL_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch MSVC redist for the installer
        run: npm run fetch-vc-redist
      - name: Install (Windows-safe)
        run: npm run install:win
      - name: Syntax checks
        run: npm test
      - name: Headless suite
        run: npm run test:headless
      - name: Build installer + portable
        run: npm run dist:win
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlainFFmpeg-windows
          path: dist/*.exe
          # Tag runs attach the files to a permanent Release instead (release
          # assets do not consume Actions storage); keep those artifacts only
          # as a one-day safety buffer. Manual runs keep 14 days for testing.
          retention-days: ${{ github.ref_type == 'tag' && 1 || 14 }}

  build-linux:
    runs-on: ubuntu-22.04
    env:
      SKIP_MODEL_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Syntax checks
        run: npm test
      - name: Headless suite
        run: npm run test:headless
      - name: Build AppImage
        run: npm run dist:linux
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlainFFmpeg-linux
          path: dist/*.AppImage
          retention-days: ${{ github.ref_type == 'tag' && 1 || 14 }}

  # Automatic Release, tag runs only (manual runs never publish).
  publish-release:
    needs: [build-win, build-linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
