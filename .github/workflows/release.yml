name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  # Artifact file names come from package.json `version`, not from the git
  # tag - this gate keeps the two in agreement so a release tag can never
  # ship files stamped with a different version.
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match package.json version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

  build-win:
    needs: [check-version]
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # CPU-only LLM binaries (skip the Vulkan dead end) + no ~1.3 GB model
      # fetch during install (thin installer - the app downloads it on first
      # launch instead).
      NODE_LLAMA_CPP_GPU: 'false'
      SKIP_MODEL_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Fetch MSVC redist for the installer
        run: npm run fetch-vc-redist
      - name: Install (Windows-safe)
        run: npm run install:win
      - name: Syntax checks
        run: npm test
      - name: Headless suite
        run: npm run test:headless
      - name: Build installer + portable
        run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: PlainFFmpeg-Windows-Setup
          path: dist/*Setup*.exe
          # Tag runs attach the files to a permanent Release instead (release
          # assets do not consume Actions storage); keep those artifacts only
          # as a one-day safety buffer. Manual runs keep 14 days for testing.
          retention-days: ${{ github.ref_type == 'tag' && 1 || 14 }}
      - name: Upload portable
        uses: actions/upload-artifact@v6
        with:
          name: PlainFFmpeg-Windows-Portable
          path: dist/*Portable*.exe
          retention-days: ${{ github.ref_type == 'tag' && 1 || 14 }}

  build-linux:
    needs: [check-version]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      NODE_LLAMA_CPP_GPU: 'false'
      SKIP_MODEL_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install
      - name: Syntax checks
        run: npm test
      - name: Headless suite
        run: npm run test:headless
      - name: Build AppImage
        run: npm run dist:linux
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: PlainFFmpeg-Linux
          path: dist/*.AppImage
          retention-days: ${{ github.ref_type == 'tag' && 1 || 14 }}

  build-mac:
    needs: [check-version]
    runs-on: macos-14
    permissions:
      contents: read
    env:
      # Apple Silicon only; Metal is the default GPU backend (no override).
      # Model stays thin-installed (fetched in-app on first launch).
      SKIP_MODEL_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install
      - name: Syntax checks
        run: npm test
      - name: Headless suite
        run: npm run test:headless
      - name: Build dmg
        run: npm run dist:mac
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: PlainFFmpeg-Mac
          path: dist/*.dmg
          retention-days: ${{ github.ref_type == 'tag' && 1 || 14 }}

  # Automatic Release, tag runs only (manual runs never publish).
  publish-release:
    needs: [build-win, build-linux, build-mac]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
