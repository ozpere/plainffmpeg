name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  # Artifact file names come from package.json `version`, not from the git
  # tag - this gate keeps the two in agreement so a release tag can never
  # ship files stamped with a different version.
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match package.json version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

  build-win:
    needs: [check-version]
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # CPU-only install-time check (skip the Vulkan attempt on GPU-less CI;
      # the GPU prebuilts still install for the packaged app) + no ~1.3 GB
      # model fetch during install (thin installer - downloaded on first launch).
      NODE_LLAMA_CPP_GPU: 'false'
      SKIP_MODEL_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Fetch MSVC redist for the installer
        run: npm run fetch-vc-redist
      - name: Install (Windows-safe)
        run: npm run install:win
      - name: Syntax checks
        run: npm test
      - name: Headless suite
        run: npm run test:headless
      - name: Build installer + portable
        run: npm run dist:win
      - name: Verify GPU prebuilt shipped
        shell: pwsh
        run: |
          $nlc = "dist/win-unpacked/resources/app.asar.unpacked/node_modules/@node-llama-cpp"
          $cpu = Join-Path $nlc "win-x64/bins/win-x64/llama-addon.node"
          $vulkan = Join-Path $nlc "win-x64-vulkan/bins/win-x64-vulkan/llama-addon.node"
          foreach ($binary in @($cpu, $vulkan)) {
            if (-not (Test-Path $binary)) {
              throw "LLM prebuilt missing from the Windows build: $binary"
            }
          }
          if (Get-ChildItem $nlc -Directory -Filter "*-cuda*") {
            throw "CUDA prebuilt must not ship in the Windows build"
          }
          Write-Host "CPU + Vulkan prebuilts present; CUDA prebuilts absent."
      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: PlainFFmpeg-Windows-Setup
          path: dist/*Setup*.exe
          if-no-files-found: error
          # Tag runs attach the files to a permanent Release instead (release
          # assets do not consume Actions storage); keep those artifacts only
          # as a one-day safety buffer. Manual runs keep 14 days for testing.
          retention-days: ${{ github.ref_type == 'tag' && 1 || 14 }}
      - name: Upload portable
        uses: actions/upload-artifact@v6
        with:
          name: PlainFFmpeg-Windows-Portable
          path: dist/*Portable*.exe
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 1 || 14 }}

  build-linux:
    needs: [check-version]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      # CPU-only install-time check; the Vulkan prebuilt still installs.
      NODE_LLAMA_CPP_GPU: 'false'
      SKIP_MODEL_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install
      - name: Syntax checks
        run: npm test
      - name: Headless suite
        run: npm run test:headless
      - name: Build AppImage
        run: npm run dist:linux
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: PlainFFmpeg-Linux
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 1 || 14 }}

  build-mac:
    needs: [check-version]
    runs-on: macos-14
    permissions:
      contents: read
    env:
      # Apple Silicon only; Metal is the default GPU backend (no override).
      # Model stays thin-installed (fetched in-app on first launch).
      SKIP_MODEL_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm install
      - name: Syntax checks
        run: npm test
      - name: Headless suite
        run: npm run test:headless
      - name: Build dmg
        run: npm run dist:mac
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: PlainFFmpeg-Mac
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 1 || 14 }}

  # Automatic Release, tag pushes only (manual runs never publish, even when
  # dispatched against a tag ref).
  publish-release:
    needs: [build-win, build-linux, build-mac]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
